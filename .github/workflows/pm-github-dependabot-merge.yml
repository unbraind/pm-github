name: Verified Dependabot squash auto-merge

on:
  workflow_call:
    inputs:
      audit-only:
        description: "Inspect all armed Dependabot requests without ever arming; for trusted scheduled callers"
        type: boolean
        required: false
        default: false
      extra-allowed-groups:
        description: "Additional exact Dependabot groups, comma or whitespace separated"
        type: string
        required: false
        default: ""
    secrets:
      merge_token:
        description: "Optional write-capable token; also configure as a Dependabot secret when required by event policy"
        required: false

permissions: {}

concurrency:
  group: pm-github-dependabot-merge-${{ github.repository }}-${{ inputs.audit-only && 'audit' || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  dependabot-merge:
    runs-on: ubuntu-latest
    # Covers the worst-case bounded policy/revocation budget plus tooling and metadata.
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.merge_token || github.token }}
      REPOSITORY: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EVENT_NAME: ${{ github.event_name }}
      EVENT_ACTOR: ${{ github.actor }}
      TRIGGERING_ACTOR: ${{ github.triggering_actor }}
      PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
      AUDIT_ONLY: ${{ inputs.audit-only }}
      EXTRA_GROUPS: ${{ inputs.extra-allowed-groups }}
    steps:
      # Revoke before even setting up Node or downloading policy. If the state
      # read fails, attempt revocation anyway; inability to revoke must be visible.
      - name: Revoke previous auto-merge before tooling
        if: ${{ !inputs.audit-only }}
        shell: bash
        run: |
          set -euo pipefail
          # A trusted runtime override may shorten the deadline, never remove its bound.
          gh_timeout="${DEPENDABOT_GH_TIMEOUT_SECONDS-60}"
          if [[ ! "${gh_timeout}" =~ ^[1-9][0-9]?$ ]] || (( gh_timeout > 60 )); then
            echo '::error::GitHub CLI timeout must be an integer from 1 to 60 seconds.'
            exit 1
          fi
          # Keep retries bounded and discard partial output from failed attempts.
          bounded_gh() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(timeout --signal=KILL "${gh_timeout}s" gh "$@" 2>/dev/null)"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "::warning::GitHub CLI failed or timed out (attempt ${attempt}/3)." >&2
            done
            return 1
          }
          [[ "${REPOSITORY}" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ && "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          armed="$(bounded_gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq 'if .state == "closed" then false elif .state == "open" and has("auto_merge") then .auto_merge != null else error("Unverifiable PR state") end')" || armed=true
          if [[ "${armed}" != false ]]; then
            if ! bounded_gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --disable-auto; then
              echo '::error::Cannot revoke auto-merge after 3 bounded attempts; request may still be armed. Check token write permissions immediately.'
              exit 1
            fi
          fi
          echo 'Previous auto-merge requests cleared before tooling.' >> "${GITHUB_STEP_SUMMARY}"
      - name: Setup policy runtime
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
      # Never check out caller/PR code. Policy comes from this workflow's commit.
      - name: Load trusted merge policy
        id: policy
        env:
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        shell: bash
        run: |
          set -euo pipefail
          # A trusted runtime override may shorten the deadline, never remove its bound.
          gh_timeout="${DEPENDABOT_GH_TIMEOUT_SECONDS-60}"
          if [[ ! "${gh_timeout}" =~ ^[1-9][0-9]?$ ]] || (( gh_timeout > 60 )); then
            echo '::error::GitHub CLI timeout must be an integer from 1 to 60 seconds.'
            exit 1
          fi
          # Keep retries bounded and discard partial output from failed attempts.
          bounded_gh() {
            local attempt output
            for attempt in 1 2 3; do
              if output="$(timeout --signal=KILL "${gh_timeout}s" gh "$@" 2>/dev/null)"; then
                printf '%s' "${output}"
                return 0
              fi
              echo "::warning::GitHub CLI failed or timed out (attempt ${attempt}/3)." >&2
            done
            return 1
          }
          policy_sha="${WORKFLOW_SHA}"
          if [[ ! "${policy_sha}" =~ ^[a-f0-9]{40}$ ]] || ! bounded_gh api "repos/unbraind/pm-github/contents/scripts/dependabot-merge.ts?ref=${policy_sha}" \
            -H 'Accept: application/vnd.github.raw+json' > "${RUNNER_TEMP}/dependabot-merge.ts"; then
            if [[ "${AUDIT_ONLY}" == true ]]; then
              echo '::error::Cannot load trusted audit policy; requests may still be armed. Retry immediately.'
              exit 1
            fi
            armed="$(bounded_gh api "repos/${REPOSITORY}/pulls/${PR_NUMBER}" --jq 'if .state == "closed" then false elif .state == "open" and has("auto_merge") then .auto_merge != null else error("Unverifiable PR state") end')" || armed=true
            if [[ "${armed}" != false ]] && ! bounded_gh pr merge "${PR_NUMBER}" --repo "${REPOSITORY}" --disable-auto; then
              echo '::error::Cannot revoke auto-merge after policy load failure and 3 bounded attempts; request may still be armed. Check token write permissions immediately.'
              exit 1
            fi
            echo '::notice::Cannot load trusted merge policy; auto-merge not armed.'
            echo 'Cannot load trusted merge policy; auto-merge not armed.' >> "${GITHUB_STEP_SUMMARY}"
            printf 'loaded=false\n' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          cat > "${RUNNER_TEMP}/run-dependabot-merge.mts" <<'TS'
          import { appendFileSync } from 'node:fs';
          import { auditDependabotMerges, runDependabotMerge } from './dependabot-merge.ts';
          const e = process.env;
          const result = e.AUDIT_ONLY === 'true' ? auditDependabotMerges(e.REPOSITORY!) : runDependabotMerge({
            repository: e.REPOSITORY!, number: e.PR_NUMBER!, event: e.EVENT_NAME!,
            actor: e.EVENT_ACTOR!, triggeringActor: e.TRIGGERING_ACTOR!, author: e.PR_AUTHOR!,
            head: e.EVENT_HEAD!, phase: e.PHASE!, metadataOutcome: e.METADATA_OUTCOME ?? '',
            group: e.DEPENDENCY_GROUP ?? '', updateType: e.UPDATE_TYPE ?? '', extraGroups: e.EXTRA_GROUPS!,
          });
          appendFileSync(e.GITHUB_STEP_SUMMARY!, '### Dependabot merge policy\n\n' + result.message + '\n');
          console.log('::notice::' + result.message.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          TS
          printf 'loaded=true\n' >> "${GITHUB_OUTPUT}"

      - name: Revoke previous auto-merge before metadata
        if: steps.policy.outputs.loaded == 'true' && !inputs.audit-only
        env:
          PHASE: revoke
        run: node "${RUNNER_TEMP}/run-dependabot-merge.mts"

      - name: Fetch Dependabot metadata
        timeout-minutes: 5
        id: metadata
        if: steps.policy.outputs.loaded == 'true' && !inputs.audit-only && github.event_name == 'pull_request_target' && github.actor == 'dependabot[bot]' && github.triggering_actor == 'dependabot[bot]' && github.event.pull_request.user.login == 'dependabot[bot]'
        continue-on-error: true
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ env.GH_TOKEN }}

      - name: Audit all commits and apply merge policy
        if: steps.policy.outputs.loaded == 'true'
        env:
          PHASE: evaluate
          METADATA_OUTCOME: ${{ steps.metadata.outcome }}
          DEPENDENCY_GROUP: ${{ steps.metadata.outputs.dependency-group }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        run: node "${RUNNER_TEMP}/run-dependabot-merge.mts"
