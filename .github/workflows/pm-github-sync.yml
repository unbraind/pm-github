# Reusable, fail-closed gated sync: GitHub issues → pm tracker → review PR.
#
# Fleet repos call this from their own scheduled caller workflow (see
# docs/sync-workflow-caller.yml); the schedule stays with the caller, the
# audited implementation stays here in pm-github.
#
# Pipeline order is the safety property: validate → dry-run plan → gated import
# (plan completeness + provenance idempotency verified BEFORE the write, then
# the fail-closed privacy gate scans the proposed tracker change AFTER it) →
# strict pm health → and only then commit + push + PR. `--gate` exits non-zero
# on any credential, personal-data, or host-path finding — or on any unreadable
# scan input — so this job can never reach the push step with a leak in the
# change. Actions are pinned by SHA.

name: Gated GitHub issues → pm sync

on:
  workflow_call:
    inputs:
      repository:
        description: "owner/repo whose issues are imported (defaults to the calling repository)"
        type: string
        required: false
        default: ${{ github.repository }}
      pm-github-version:
        description: "Exact published pm-github version to install (pin; never a floating tag or latest)"
        type: string
        required: true
      sync-branch:
        description: "Branch the gated import commits to and the review PR is opened from"
        type: string
        required: false
        default: "automation/pm-github-sync"
      node-version:
        description: "Node.js version for the pm CLI"
        type: string
        required: false
        default: "22.18.0"

# Least privilege for the job's needs: push the sync branch (contents: write)
# and create/update the review PR (pull-requests: write). Nothing else.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pm-github-sync-${{ inputs.repository }}
  cancel-in-progress: false

jobs:
  gated-sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ inputs.repository }}
      SYNC_BRANCH: ${{ inputs.sync-branch }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      # Always rebuild the sync branch from current main: the branch only ever
      # holds automated sync commits, so a reset keeps the PR a clean review of
      # exactly this run's proposed change instead of an ever-growing merge.
      - name: Prepare sync branch from main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --force origin main
          git switch --force-create "${SYNC_BRANCH}" origin/main

      # The calling repo's own devDependency provides the pm CLI (npm ci).
      - name: Install dependencies
        run: npm ci

      - name: Install pinned pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          ./node_modules/.bin/pm package install "npm:pm-github@${{ inputs.pm-github-version }}" --project
          node -e 'if (require("./.agents/pm/extensions/pm-github/package.json").version !== process.argv[1]) process.exit(1)' "${{ inputs.pm-github-version }}"

      # Keep the install's bookkeeping out of the sync diff; the extension tree
      # itself is operational state the privacy gate deliberately excludes.
      - name: Restore managed extension registry
        shell: bash
        run: |
          set -euo pipefail
          managed_registry=".agents/pm/extensions/.managed-extensions.json"
          if git ls-files --error-unmatch "${managed_registry}" > /dev/null 2>&1; then
            git restore -- "${managed_registry}"
          else
            rm -f "${managed_registry}"
          fi

      - name: Validate GitHub access
        run: ./node_modules/.bin/pm github validate --repo "${REPOSITORY}"

      - name: Preview GitHub to pm plan
        run: ./node_modules/.bin/pm github import "${REPOSITORY}" --state all --atomic --dry-run

      # The gate step. A finding (or unreadable scan input) fails this step, so
      # the job never reaches the commit/push below with a leak in the change.
      - name: Gated GitHub to pm import
        run: ./node_modules/.bin/pm github import "${REPOSITORY}" --state all --atomic --gate

      - name: Verify strict pm health
        run: ./node_modules/.bin/pm health --strict-exit

      - name: Commit gated sync changes and open review PR
        shell: bash
        run: |
          set -euo pipefail
          git add -- .agents/pm ':(exclude).agents/pm/extensions' ':(exclude).agents/pm/locks' ':(exclude).agents/pm/checkpoints'
          if git diff --cached --quiet; then
            echo "GitHub issues already match the pm tracker; no PR is needed."
            exit 0
          fi
          git diff --cached --check
          links_file="${RUNNER_TEMP}/pm-github-sync-links.md"
          : > "${links_file}"
          while IFS= read -r changed; do
            case "${changed}" in
              .agents/pm/*/*.toon)
                item_id="${changed##*/}"
                item_id="${item_id%.toon}"
                printf -- '- [%s](https://github.com/%s/blob/main/%s)\n' "${item_id}" "${REPOSITORY}" "${changed}" >> "${links_file}"
                ;;
            esac
          done < <(git diff --cached --name-only -- .agents/pm)
          if [[ ! -s "${links_file}" ]]; then
            echo "::error::The sync changed tracker state but no item link could be generated."
            exit 1
          fi
          git commit -m "chore(pm): sync GitHub issues (gated)"
          git push --force origin "${SYNC_BRANCH}"
          body_file="${RUNNER_TEMP}/pm-github-sync-pr.md"
          {
            printf '%s\n\n' "Automated pm-github issue synchronization for ${REPOSITORY}."
            printf '%s\n\n' "The import ran with \`--gate\`: the plan was verified for completeness and provenance idempotency before the write, and the proposed tracker change passed the fail-closed privacy gate before anything was committed. \`main\` is never pushed directly."
            printf '%s\n\n' "Tracker items changed:"
            cat "${links_file}"
          } > "${body_file}"
          pr_number="$(gh pr list -R "${REPOSITORY}" --head "${SYNC_BRANCH}" --base main --state open --json number --jq '.[0].number // empty')"
          if [[ -z "${pr_number}" ]]; then
            gh pr create -R "${REPOSITORY}" --base main --head "${SYNC_BRANCH}" --title "chore(pm): sync GitHub issues (gated)" --body-file "${body_file}"
          else
            gh pr edit "${pr_number}" -R "${REPOSITORY}" --body-file "${body_file}"
          fi