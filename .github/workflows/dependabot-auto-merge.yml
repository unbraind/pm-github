name: dependabot-auto-merge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, edited]

permissions: {}

jobs:
  verified-auto-merge:
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/pm-github-dependabot-merge.yml
    secrets:
      merge_token: ${{ secrets.DEPENDABOT_MERGE_TOKEN }}
