name: Review release commands
on:
  push:
    branches: ["fix/import-and-release-issues"]
permissions:
  contents: read
jobs:
  release-check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [npm, bun]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: npm
      - uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: "1.3.14"
      - run: npm ci
      - name: Exact release command with isolated identity
        shell: bash
        env:
          REVIEW_RUNTIME: ${{ matrix.runtime }}
        run: |
          set -euo pipefail
          export HOME="$(mktemp -d)" GIT_CONFIG_GLOBAL=/dev/null GIT_CONFIG_NOSYSTEM=1
          if [[ "$REVIEW_RUNTIME" == npm ]]; then
            npm run release:check
          else
            bun run release:check
          fi
