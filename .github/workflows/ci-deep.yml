name: CI Deep

on:
  push:
    branches: [main]
  schedule:
    # Off peak, separate from daily release (03:23), hourly recovery (:41),
    # Dependabot (04:23), and weekly CodeQL (03:43 Monday).
    - cron: "11 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-deep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deep:
    name: deep (${{ matrix.node-version }}, ${{ matrix.runner }})
    runs-on: ${{ vars.PM_LOCAL_DEEP != 'off' && fromJSON('["self-hosted","pm-local"]') || 'ubuntu-latest' }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 26]
        runner: [npm, bun]
    env:
      PM_TEST_DEPTH: full
      PM_TEST_TIME_SCALE: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          # Exact pin: setup-bun resolves floating versions via an
          # unauthenticated api.github.com tag listing, which GitHub-hosted
          # runners routinely get 503/rate-limited on (broke this repo's CI
          # 3 runs in a row). An exact version downloads directly instead.
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Verify tracked pm project health
        run: ./node_modules/.bin/pm health --strict-exit --require-merge-drivers

      - name: Full npm release gate
        if: matrix.runner == 'npm'
        run: npm run release:check

      - name: Full Bun release gate
        if: matrix.runner == 'bun'
        run: bun run release:check

      - name: Verify Bun can install the package graph
        if: matrix.runner == 'npm'
        run: bun install --no-save

      # This guards native runtime behavior; bun run release:check uses Node
      # for its node-based scripts and therefore cannot replace this suite.
      - name: Exhaustive native Bun extension behavior
        if: matrix.runner == 'npm'
        run: npm run test:bun
