# Reusable closeout: verified merged delivery → gated tracker diff → review PR.
# Scope helpers intentionally match gated sync; executable parity tests prevent drift.

name: Gated merged-PR → pm closeout

on:
  workflow_call:
    inputs:
      repository:
        description: "owner/repo whose merged PRs deliver items (defaults to the calling repository)"
        type: string
        required: false
        default: ${{ github.repository }}
      pm-github-version:
        description: "Deprecated exact extension hold; omit to follow the workflow release (differing holds warn)"
        type: string
        required: false
        default: ""
      npm-project-dir:
        description: "Caller npm project directory for dependencies and post-closeout-script (relative, inside the workspace)"
        type: string
        required: false
        default: "."
      post-closeout-script:
        description: "Caller npm script after closeout, before the final gate; missing skips, empty disables it"
        type: string
        required: false
        default: "changelog:full"
      ci-workflows:
        description: "Caller workflow filenames with workflow_dispatch; empty disables dispatch and auto-merge"
        type: string
        required: false
        default: "ci.yml codeql.yml"
      required-checks:
        description: "One required context name per line; spaces are preserved and blank lines ignored; needed only when either the classic source (protection or branch summary) or the ruleset metadata is unreadable"
        type: string
        required: false
        default: ""
      automation-app-client-id:
        description: "Optional GitHub App client ID; pair with automation_app_private_key for eligible native PR checks"
        type: string
        required: false
        default: ""
      node-version:
        description: "Node.js version for the pm CLI"
        type: string
        required: false
        default: "22.18.0"

    outputs:
      pr-url:
        description: "Owned automation pull request URL"
        value: ${{ jobs.gated-closeout.outputs.pr-url }}
      ci-run-urls:
        description: "JSON array of registered caller CI run URLs"
        value: ${{ jobs.gated-closeout.outputs.ci-run-urls }}
      parked-run-urls:
        description: "JSON array of already approval-required run URLs"
        value: ${{ jobs.gated-closeout.outputs.parked-run-urls }}
      ci-confirmation:
        description: "confirmed, timed_out, or disabled; never waits for completion"
        value: ${{ jobs.gated-closeout.outputs.ci-confirmation }}

    secrets:
      automation_app_private_key:
        description: "Private key for the optional automation App installed on the calling repository"
        required: false

concurrency:
  group: pm-github-closeout-${{ github.repository }}
  cancel-in-progress: false

# No workflow-wide grant: the job below requests exactly what it needs.
permissions: {}

jobs:
  gated-closeout:
    # Read delivery evidence, push only the closeout branch, and maintain one PR.
    permissions:
      contents: write
      pull-requests: write
      checks: read
      actions: write
    runs-on: ubuntu-latest
    # Every step is bounded work with no in-job wait for other runs; landing is
    # owned by GitHub's native auto-merge and the next scheduled closeout, so a
    # hung job must stop here instead of holding a shared fleet runner.
    timeout-minutes: 60
    outputs:
      pr-url: ${{ steps.ci_handoff.outputs.pr-url }}
      ci-run-urls: ${{ steps.ci_handoff.outputs.ci-run-urls }}
      parked-run-urls: ${{ steps.ci_handoff.outputs.parked-run-urls }}
      ci-confirmation: ${{ steps.ci_handoff.outputs.ci-confirmation }}
    env:
      REPOSITORY: ${{ inputs.repository }}
      SYNC_BRANCH: pm-github/closeout
      REQUESTED_PM_GITHUB_VERSION: ${{ inputs.pm-github-version }}
      NPM_PROJECT_DIR: ${{ inputs.npm-project-dir }}
      POST_CLOSEOUT_SCRIPT: ${{ inputs.post-closeout-script }}
      REQUIRED_CHECKS: ${{ inputs.required-checks }}
      CI_WORKFLOWS: ${{ inputs.ci-workflows }}
      CALLING_REPOSITORY: ${{ github.repository }}
    steps:
      # Revoke a previous run's request before guards, installs, evidence reads or pushes.
      - name: Disarm previous closeout auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'CLOSEOUT_AUTOMERGE_ALLOWED=false\n' >> "${GITHUB_ENV}"
          # Use the caller identity and fixed branch, even when input validation fails.
          # Filter same-repository heads; a fork using the same branch is never ours.
          numbers="$(gh pr list -R "${CALLING_REPOSITORY}" --head pm-github/closeout --state open \
            --json number,headRepository,headRepositoryOwner,isCrossRepository,autoMergeRequest \
            | jq -r --arg repository "${CALLING_REPOSITORY}" \
              '.[] | select(.isCrossRepository == false and (.headRepositoryOwner.login + "/" + .headRepository.name) == $repository and .autoMergeRequest != null) | .number')"
          while IFS= read -r number; do
            [[ -n "${number}" ]] || continue
            gh pr merge "${number}" -R "${CALLING_REPOSITORY}" --disable-auto
          done <<< "${numbers}"

      - name: Require caller default branch
        id: caller_branch
        env:
          RUN_REF: ${{ github.ref }}
          EVENT_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DEFAULT_BRANCH="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.default_branch // empty' 2>/dev/null)" || DEFAULT_BRANCH=""
          DEFAULT_BRANCH="${DEFAULT_BRANCH:-${EVENT_DEFAULT_BRANCH:-}}"
          if [[ -z "${DEFAULT_BRANCH}" ]] || ! git check-ref-format "refs/heads/${DEFAULT_BRANCH}" >/dev/null 2>&1; then
            echo "::error::Cannot resolve a valid caller default branch from the repository API or event payload."
            exit 1
          fi
          expected_ref="refs/heads/${DEFAULT_BRANCH}"
          if [[ "${RUN_REF}" != "${expected_ref}" ]]; then
            printf '::error::Closeout ref "%s" must match caller default branch ref "%s".\n' "${RUN_REF}" "${expected_ref}"
            exit 1
          fi
          printf 'branch=%s\n' "${DEFAULT_BRANCH}" >> "${GITHUB_OUTPUT}"
          printf 'DEFAULT_BRANCH=%s\n' "${DEFAULT_BRANCH}" >> "${GITHUB_ENV}"

      - name: Resolve pm-github release version
        shell: bash
        env:
          # The job context identifies the reusable workflow, not the caller.
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          [[ "${WORKFLOW_SHA}" =~ ^[a-f0-9]{40}$ ]] || { echo "::error::Cannot identify the reusable workflow commit from job.workflow_sha."; exit 1; }
          # job.workflow_sha belongs to this reusable job, even for a tag pin.
          # Fetch our manifest at that immutable commit; the caller checkout and
          # release-tag spelling are never version authorities.
          manifest="$(curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/unbraind/pm-github/${WORKFLOW_SHA}/package.json")" || { echo "::error::Cannot read pm-github package.json at the reusable workflow commit."; exit 1; }
          workflow_version="$(jq -ser 'select(length == 1) | .[0] | select(.name == "pm-github") | .version | select(type == "string" and (contains("\n") | not) and (contains("\r") | not))' <<< "${manifest}" 2>/dev/null)" || { echo "::error::Invalid pm-github workflow package metadata."; exit 1; }
          grep -zEq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' < <(printf '%s\0' "${workflow_version}") || { echo "::error::Workflow package version must be an exact numeric version: N.N.N or N.N.N-N."; exit 1; }
          # Release tags keep zero-padded date components (v2026.11.02) while the
          # daily release plan publishes npm versions without padding (2026.11.2),
          # so strip the padding from every component before comparing or installing.
          # Pure string operations on operands already validated as N.N.N or N.N.N-N:
          # no arithmetic, so no component can overflow or be evaluated.
          normalize_pm_github_version() {
            local version="${1}" suffix="" normalized="" part
            if [[ "${version}" == *"-"* ]]; then
              suffix="${version##*-}"
              version="${version%-*}"
            fi
            local IFS='.'
            read -r -a parts <<< "${version}"
            for part in "${parts[@]}"; do
              # Strip the leading zeros as text; an all-zero component stays 0.
              part="${part#"${part%%[!0]*}"}"
              normalized+="${normalized:+.}${part:-0}"
            done
            printf '%s' "${normalized}${suffix:+-${suffix}}"
          }
          workflow_version="$(normalize_pm_github_version "${workflow_version}")"
          PM_GITHUB_VERSION="${workflow_version}"
          if [[ -n "${REQUESTED_PM_GITHUB_VERSION}" ]]; then
            grep -zEq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' < <(printf '%s\0' "${REQUESTED_PM_GITHUB_VERSION}") || { echo "::error::pm-github-version must be an exact numeric version: N.N.N or N.N.N-N."; exit 1; }
            PM_GITHUB_VERSION="$(normalize_pm_github_version "${REQUESTED_PM_GITHUB_VERSION}")"
            if [[ "${PM_GITHUB_VERSION}" != "${workflow_version}" ]]; then
              echo "::warning::pm-github-version is deprecated: workflow ${workflow_version} installs extension ${PM_GITHUB_VERSION} as an explicit hold. Drop pm-github-version to follow the workflow release."
            fi
          fi
          # Resolve existence before setup, extension installation, or tracker writes.
          # Public registry reads require no npm configuration or credentials.
          package="$(curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            "https://registry.npmjs.org/pm-github/${PM_GITHUB_VERSION}")" || { echo "::error::Selected pm-github extension ${PM_GITHUB_VERSION} is unavailable; refusing tracker writes."; exit 1; }
          jq -se --arg version "${PM_GITHUB_VERSION}" 'length == 1 and .[0].name == "pm-github" and .[0].version == $version' <<< "${package}" >/dev/null 2>&1 || { echo "::error::Registry metadata does not identify the selected pm-github version; refusing tracker writes."; exit 1; }
          printf 'PM_GITHUB_VERSION=%s\n' "${PM_GITHUB_VERSION}" >> "${GITHUB_ENV}"

      - name: Validate closeout inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "${REPOSITORY}" == "${CALLING_REPOSITORY}" ]] || { echo "::error::repository must equal the calling repository (${CALLING_REPOSITORY})."; exit 1; }
          grep -zEq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$' < <(printf '%s\0' "${PM_GITHUB_VERSION}") || { echo "::error::pm-github-version must be an exact numeric version: N.N.N or N.N.N-N."; exit 1; }
          [[ "${SYNC_BRANCH}" == pm-github/closeout ]] || { echo "::error::Closeout branch must be pm-github/closeout."; exit 1; }
          git check-ref-format "refs/heads/${SYNC_BRANCH}"
          [[ "${SYNC_BRANCH}" != "${DEFAULT_BRANCH}" ]] || { echo "::error::The closeout bot branch cannot be the caller default branch."; exit 1; }
          [[ -z "${POST_CLOSEOUT_SCRIPT:-}" || "${POST_CLOSEOUT_SCRIPT:-}" =~ ^[a-zA-Z0-9_][a-zA-Z0-9_.:-]*$ ]] || { echo "::error::post-closeout-script must be an npm script name, not a shell command."; exit 1; }

      - name: Checkout caller default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ steps.caller_branch.outputs.branch }}
          persist-credentials: false

      - name: Validate npm project directory
        shell: bash
        run: |
          set -euo pipefail
          invalid_npm_project() {
            echo "::error::npm-project-dir must be a relative path without .. segments, resolve inside the workspace, and contain package.json."
            exit 1
          }
          [[ -n "${NPM_PROJECT_DIR}" && "${NPM_PROJECT_DIR}" != /* && "${NPM_PROJECT_DIR}" != *[$'\r\n:']* ]] || invalid_npm_project
          case "/${NPM_PROJECT_DIR}/" in */../*) invalid_npm_project ;; esac
          workspace="$(realpath -e -- "${GITHUB_WORKSPACE}" 2>/dev/null)" || invalid_npm_project
          IFS= read -r -d '' npm_project_path < <(realpath -ez -- "${GITHUB_WORKSPACE}/${NPM_PROJECT_DIR}" 2>/dev/null) || invalid_npm_project
          [[ "${npm_project_path}" == "${workspace}" || "${npm_project_path}" == "${workspace}/"* ]] || invalid_npm_project
          [[ "${npm_project_path}" != *[$'\r\n:']* && -f "${npm_project_path}/package.json" ]] || invalid_npm_project
          printf 'NPM_PROJECT_PATH=%s\n' "${npm_project_path}" >> "${GITHUB_ENV}"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: |
            ${{ env.NPM_PROJECT_PATH }}/package-lock.json
            ${{ env.NPM_PROJECT_PATH }}/npm-shrinkwrap.json

      # Rebuild the closeout branch from the current default branch: it only
      # holds automated closeout commits, keeping the PR a clean review of
      # exactly this run's proposed change instead of an ever-growing merge.
      - name: Prepare sync branch from default branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          sync_lease="$(git rev-parse --verify "refs/remotes/origin/${SYNC_BRANCH}" 2>/dev/null || true)"
          printf 'SYNC_LEASE=%s\n' "${sync_lease}" >> "${GITHUB_ENV}"
          git switch --force-create "${SYNC_BRANCH}" "origin/${DEFAULT_BRANCH}"

      # The calling repo's own devDependency provides the pm CLI (npm ci).
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          (cd "${NPM_PROJECT_PATH}" && npm ci --ignore-scripts)
          printf '%s/node_modules/.bin\n' "${NPM_PROJECT_PATH}" >> "${GITHUB_PATH}"

      # The explicit publication allowlist is the SDK-resolved tracker (except
      # extensions, locks, checkpoints and extension setup files) and CHANGELOG.md. Nothing else may
      # change, even if unstaged or untracked. Keep all boundaries on this list.
      - name: Resolve sync commit scope
        shell: bash
        run: |
          set -euo pipefail
          PM_SYNC_TRACKER="$(cd "${NPM_PROJECT_PATH}" && node --input-type=module -e 'import { resolvePmRoot } from "@unbrained/pm-cli/sdk"; import { relative } from "node:path"; const p = relative(process.env.GITHUB_WORKSPACE, resolvePmRoot(process.env.GITHUB_WORKSPACE)); if (!p || p === ".." || p.startsWith("../") || /[\r\n]/.test(p)) throw new Error("Sync tracker must be inside the repository"); process.stdout.write(p);')"
          export PM_SYNC_TRACKER
          printf 'PM_SYNC_TRACKER=%s\n' "${PM_SYNC_TRACKER}" >> "${GITHUB_ENV}"
          cat > "${RUNNER_TEMP}/pm-github-sync-scope.sh" <<'SCOPE'
          report_workflow_failure() {
            local report_file="$1" error_file="$2" diff_file="${3:-/dev/null}"
            local diagnostic="${RUNNER_TEMP}/pm-github-diagnostic.json"
            local patch="${RUNNER_TEMP}/pm-github-diagnostic.patch"
            pm github workflow-diagnostic --report "${report_file}" --error-file "${error_file}" --diff "${diff_file}" --json > "${diagnostic}"
            { printf '%s\n' '--- /dev/null' '+++ b/workflow-diagnostic.txt' '@@ -0,0 +1 @@'; jq -r '"+" + (.reason | gsub("[\\r\\n]"; " "))' "${diagnostic}"; } > "${patch}"
            if pm github gate --diff "${patch}" --json > "${RUNNER_TEMP}/pm-github-diagnostic-gate.json" 2> "${RUNNER_TEMP}/pm-github-diagnostic-gate.err"; then
              jq -r '"::error::" + (.reason | gsub("%"; "%25") | gsub("\\r"; "%0D") | gsub("\\n"; "%0A"))' "${diagnostic}"
            else
              echo "::error::Failure diagnostic blocked by the privacy gate; review source content before retrying. No branch was published."
            fi
          }
          mapfile -t sync_scope < <(printf '%s\n' \
            ":(top,literal)${PM_SYNC_TRACKER}" \
            ':(top,literal)CHANGELOG.md' \
            ":(top,exclude,literal)${PM_SYNC_TRACKER}/extensions" \
            ":(top,exclude,literal)${PM_SYNC_TRACKER}/locks" \
            ":(top,exclude,literal)${PM_SYNC_TRACKER}/checkpoints" \
            ":(top,exclude,literal)${PM_SYNC_TRACKER}/settings.json" \
            ":(top,exclude,literal)${PM_SYNC_TRACKER}/history/_workspace.jsonl")
          restore_sync_setup() {
            for setup_path in "${PM_SYNC_TRACKER}/settings.json" "${PM_SYNC_TRACKER}/history/_workspace.jsonl"; do
              if git cat-file -e "HEAD:${setup_path}" 2>/dev/null; then
                git --literal-pathspecs restore --source=HEAD --staged --worktree -- "${setup_path}"
              else
                git --literal-pathspecs rm -q --cached --ignore-unmatch -- "${setup_path}"
                rm -f -- "${setup_path}"
              fi
            done
          }
          restore_workflow_setup_artifacts() {
            for setup_path in .gitattributes "${PM_SYNC_TRACKER}/extensions/.managed-extensions.json"; do
              if git cat-file -e "HEAD:${setup_path}" 2>/dev/null; then
                git --literal-pathspecs restore --source=HEAD --staged --worktree -- "${setup_path}"
              else
                git --literal-pathspecs rm -q --cached --ignore-unmatch -- "${setup_path}"
                rm -f -- "${setup_path}"
              fi
            done
          }
          check_sync_setup_clean() {
            for setup_path in .gitattributes "${PM_SYNC_TRACKER}/extensions/.managed-extensions.json"; do
              git --literal-pathspecs ls-files --others -z -- "${setup_path}" > "${RUNNER_TEMP}/pm-github-setup-status"
              if ! git --literal-pathspecs diff --quiet -- "${setup_path}" || \
                 ! git --literal-pathspecs diff --cached --quiet -- "${setup_path}" || \
                 [[ -s "${RUNNER_TEMP}/pm-github-setup-status" ]]; then
                printf '::error::Changed path outside sync commit scope: %q\n' "${setup_path}"
                return 1
              fi
            done
          }
          check_sync_scope() {
            check_sync_setup_clean
            local entry path failed=0
            git status --porcelain=v1 -z --untracked-files=all > "${RUNNER_TEMP}/pm-github-sync-status"
            while IFS= read -r -d '' entry; do
              path="${entry:3}"
              check_sync_path "${path}" || failed=1
              # Porcelain -z renames/copies contain a second, original path.
              if [[ "${entry:0:2}" == *R* || "${entry:0:2}" == *C* ]]; then
                IFS= read -r -d '' path || { echo '::error::Incomplete Git status record.'; return 1; }
                check_sync_path "${path}" || failed=1
              fi
            done < "${RUNNER_TEMP}/pm-github-sync-status"
            return "${failed}"
          }
          check_sync_path() {
            if [[ "$1" == "${PM_SYNC_TRACKER}/extensions" || "$1" == "${PM_SYNC_TRACKER}/extensions/"* || \
                  "$1" == "${PM_SYNC_TRACKER}/locks" || "$1" == "${PM_SYNC_TRACKER}/locks/"* || \
                  "$1" == "${PM_SYNC_TRACKER}/checkpoints" || "$1" == "${PM_SYNC_TRACKER}/checkpoints/"* ]]; then
              : # Runtime paths are deliberately outside the publication allowlist.
            elif [[ "$1" == "${PM_SYNC_TRACKER}/"* || "$1" == CHANGELOG.md ]]; then
              return 0
            fi
            printf '::error::Changed path outside sync commit scope: %q\n' "$1"
            return 1
          }
          gate_sync_change() {
            check_sync_scope
            git ls-files -z --modified --deleted --others --exclude-standard -- "${sync_scope[0]}" "${sync_scope[@]:2}" > "${RUNNER_TEMP}/pm-github-sync-stage-paths"
            if [[ -s "${RUNNER_TEMP}/pm-github-sync-stage-paths" ]]; then
              git --literal-pathspecs add --pathspec-from-file="${RUNNER_TEMP}/pm-github-sync-stage-paths" --pathspec-file-nul
            fi
            if [[ -e CHANGELOG.md ]] || git ls-files --error-unmatch -- CHANGELOG.md >/dev/null 2>&1; then
              git --literal-pathspecs add -- CHANGELOG.md
            fi
            git diff --cached --name-only -z --no-renames -- "${sync_scope[@]}" > "${RUNNER_TEMP}/pm-github-sync-commit-paths"
            mapfile -d '' -t sync_paths < "${RUNNER_TEMP}/pm-github-sync-commit-paths"
            : > "${RUNNER_TEMP}/pm-github-sync.patch"
            if [[ ${#sync_paths[@]} -gt 0 ]]; then
              git --literal-pathspecs diff --cached --no-color --no-ext-diff --no-textconv --no-renames --binary --unified=2147483647 -- "${sync_paths[@]}" > "${RUNNER_TEMP}/pm-github-sync.patch"
            fi
            pm github gate --diff "${RUNNER_TEMP}/pm-github-sync.patch" --json
          }
          SCOPE

      # Restore only these two files inside the bounded setup windows.
      # Refuse existing edits (including ignored files) before claiming ownership.
      - name: Require clean setup artifacts
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          check_sync_setup_clean

      - name: Install pinned pm-github extension
        shell: bash
        run: |
          set -euo pipefail
          pm package install "npm:pm-github@${PM_GITHUB_VERSION}" --project
          node -e '
            let installed;
            try {
              installed = require("./" + process.argv[2] + "/extensions/pm-github/package.json").version;
            } catch {
              console.error("::error::Cannot read installed pm-github version; verify package installation completed for the resolved tracker.");
              process.exit(1);
            }
            if (installed !== process.argv[1]) {
              const safe = value => typeof value === "string" && /^[0-9]+\.[0-9]+\.[0-9]+(-[0-9]+)?$/.test(value) ? value : "<invalid>";
              console.error("::error::Installed pm-github version " + safe(installed) + " differs from resolved workflow version " + safe(process.argv[1]) + ". Check release-tag normalization and package installation; adopt a newer workflow release pin.");
              process.exit(1);
            }
          ' "${PM_GITHUB_VERSION}" "${PM_SYNC_TRACKER}"

      - name: Configure PM merge drivers
        run: pm merge install

      # Runtime setup must be absent from every publication/privacy scan.
      # Save it outside the checkout only for the bounded strict-health step.
      - name: Isolate workflow setup artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p -- "${RUNNER_TEMP}/pm-github-setup"
          cp -p -- .gitattributes "${RUNNER_TEMP}/pm-github-setup/attributes"
          cp -p -- "${PM_SYNC_TRACKER}/extensions/.managed-extensions.json" "${RUNNER_TEMP}/pm-github-setup/registry"
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          restore_workflow_setup_artifacts

      - name: Verify gate is available
        run: pm github gate --json

      - name: Close delivered tracker items
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          # Full history catches up after missed schedules; the command skips terminal items.
          # Keep the report private until the proposed change has passed the privacy gate.
          required_args=()
          # Forward the newline-joined list as one literal argument; TypeScript parses lines.
          if [[ -n "${REQUIRED_CHECKS:-}" ]]; then
            required_args+=(--required-checks "${REQUIRED_CHECKS}")
          fi
          if ! pm github closeout --repo "${REPOSITORY}" --since 1970-01-01 --apply --json "${required_args[@]}" > "${RUNNER_TEMP}/pm-github-closeout.json" 2> "${RUNNER_TEMP}/pm-github-closeout.err"; then
            report_workflow_failure "${RUNNER_TEMP}/pm-github-closeout.json" "${RUNNER_TEMP}/pm-github-closeout.err"
            exit 1
          fi
          jq -e '.command == "github closeout" and .dry_run == false and .failed == 0 and (.closed | type == "number")' "${RUNNER_TEMP}/pm-github-closeout.json" >/dev/null
          # Only a local tracker refusal makes missing head evidence actionable.
          # Foreign, terminal, excluded and unlinked PRs cannot block this run.
          jq -e 'all(.plan[]; (.code | type) == "string")' "${RUNNER_TEMP}/pm-github-closeout.json" >/dev/null
          if jq -e 'any(.plan[]; .action == "skip" and (.code == "head_evidence_unavailable" or .code == "required_checks_unverified"))' "${RUNNER_TEMP}/pm-github-closeout.json" >/dev/null; then
            report_workflow_failure "${RUNNER_TEMP}/pm-github-closeout.json" /dev/null
            exit 1
          fi
          # Merge facts are checked before head lookup and have a distinct decision.
          if jq -e 'any(.plan[]; .action == "skip" and .code == "incomplete_merge")' "${RUNNER_TEMP}/pm-github-closeout.json" >/dev/null; then
            report_workflow_failure "${RUNNER_TEMP}/pm-github-closeout.json" /dev/null
            exit 1
          fi
          # Persist only safe attribution facts so an all-held run can still open a review PR.
          review_file="${PM_SYNC_TRACKER}/closeout-review.json"
          review_count="$(jq '[.plan[] | select(.action == "needs_review")] | length' "${RUNNER_TEMP}/pm-github-closeout.json")"
          if [[ "${review_count}" != 0 ]]; then
            jq '{needs_review: ([.plan[] | select(.action == "needs_review") | {item, action, candidates} + (if .missing_evidence then {missing_evidence} else {} end)] | unique_by(.item))}' "${RUNNER_TEMP}/pm-github-closeout.json" > "${review_file}"
          elif [[ -f "${review_file}" ]]; then
            rm -- "${review_file}"
          fi
          printf 'CLOSEOUT_REVIEW=%s\n' "${review_count}" >> "${GITHUB_ENV}"
          printf 'CLOSEOUT_CLOSED=%s\n' "$(jq -r '.closed' "${RUNNER_TEMP}/pm-github-closeout.json")" >> "${GITHUB_ENV}"

      - name: Run caller post-closeout script
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${POST_CLOSEOUT_SCRIPT}" ]]; then
            changelog_args=()
            # Tracker automation is not a release, even when package.json is untagged.
            if [[ "${POST_CLOSEOUT_SCRIPT}" == "changelog:full" ]]; then
              changelog_args=(-- --no-pending-release)
            fi
            (cd "${NPM_PROJECT_PATH}" && npm run --if-present "${POST_CLOSEOUT_SCRIPT}" "${changelog_args[@]}")
          fi

      # Check every changed path immediately after the caller script. Extension
      # setup files stay outside the patch and are restored before publication.
      - name: Gate tracker and regenerated changelog
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          gate_sync_change

      # No caller code runs while runtime setup is temporarily active for health.
      # Check the baseline first and restore even on failure, before any later gate.
      - name: Verify strict pm health
        shell: bash
        run: |
          set -euo pipefail
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          check_sync_setup_clean
          trap restore_workflow_setup_artifacts EXIT
          cp -p -- "${RUNNER_TEMP}/pm-github-setup/attributes" .gitattributes
          cp -p -- "${RUNNER_TEMP}/pm-github-setup/registry" "${PM_SYNC_TRACKER}/extensions/.managed-extensions.json"
          pm health --strict-exit

      # Mint only after caller scripts and local gates have finished. The key
      # is passed only to the pinned official action; its token is repo-scoped.
      - name: Create automation app token
        id: automation_token
        if: inputs.automation-app-client-id != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ inputs.automation-app-client-id }}
          private-key: ${{ secrets.automation_app_private_key }}
          repositories: ${{ github.repository }}
          skip-token-revoke: false
          permission-contents: write
          permission-pull-requests: write
          permission-actions: write
          permission-checks: read
          permission-statuses: read

      - name: Validate publication credentials
        id: publication_auth
        env:
          APP_CLIENT_ID: ${{ inputs.automation-app-client-id }}
          HAS_APP_PRIVATE_KEY: ${{ secrets.automation_app_private_key != '' }}
          HAS_AUTOMATION_TOKEN: ${{ steps.automation_token.outputs.token != '' }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${APP_CLIENT_ID:-}" ]]; then
            if [[ "${HAS_APP_PRIVATE_KEY:-false}" == true ]]; then
              echo "::error::automation_app_private_key requires automation-app-client-id."
              exit 1
            fi
            echo "::notice::Using GITHUB_TOKEN: native PR runs require approval, and dispatched checks cannot satisfy PR branch rules. Configure the optional automation App for unattended landing."
          elif [[ "${HAS_APP_PRIVATE_KEY:-false}" != true || "${HAS_AUTOMATION_TOKEN:-false}" != true ]]; then
            echo "::error::Configured automation App did not produce a token; check its private key, installation and repository permissions."
            exit 1
          else
            # Start the App deadline immediately after minting, before publication.
            printf 'deadline=%s\n' "$(( $(date +%s) + 2400 ))" >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit gated closeout changes and open review PR
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          trap 'echo "::error::Closeout publication refused; token requires contents:write and pull-requests:write, and repository settings must allow Actions to create PRs."' ERR
          source "${RUNNER_TEMP}/pm-github-sync-scope.sh"
          gate_sync_change
          # gh pr list --head matches branch names, and a fork can open a PR
          # from a branch with the same name, so filter the results to PRs whose
          # head repository is this repository (never trust .[0] alone).
          own_open_pr() {
            gh pr list -R "${REPOSITORY}" --head "${SYNC_BRANCH}" --base "${DEFAULT_BRANCH}" --state open \
              --json number,headRepository,headRepositoryOwner,isCrossRepository \
              | jq -r --arg repository "${REPOSITORY}" \
                '[ .[] | select(.isCrossRepository == false and (.headRepositoryOwner.login + "/" + .headRepository.name) == $repository) | .number ][0] // empty'
          }
          close_own_open_pr() {
            local number
            number="$(own_open_pr)"
            if [[ -n "${number}" ]]; then
              gh pr close "${number}" -R "${REPOSITORY}" --comment "No delivered tracker items remain to close; closing this review PR."
            fi
          }
          if [[ "${CLOSEOUT_CLOSED}" == 0 && "${CLOSEOUT_REVIEW:-0}" == 0 ]] || git diff --cached --quiet -- "${sync_scope[0]}" "${sync_scope[@]:2}"; then
            # Changelog drift alone belongs to the caller's changelog check;
            # publish regenerated output only alongside tracker changes.
            if ! git diff --cached --quiet -- CHANGELOG.md; then
              if git cat-file -e HEAD:CHANGELOG.md 2>/dev/null; then
                git --literal-pathspecs restore --source=HEAD --staged --worktree -- CHANGELOG.md
              else
                git --literal-pathspecs rm -q --cached --ignore-unmatch -- CHANGELOG.md
                rm -f -- CHANGELOG.md
              fi
              echo "::notice::The caller's changelog differs from a fresh regeneration; the repository's own changelog:check owns that drift. Discarding CHANGELOG.md because no tracker item changed."
            fi
            restore_sync_setup
            echo "No delivered tracker items closed; no branch or PR is needed."
            # A stale own review PR would still look actionable although this
            # run has no change to propose, so close it before returning.
            close_own_open_pr
            exit 0
          fi
          git diff --cached --check
          links_file="${RUNNER_TEMP}/pm-github-sync-links.md"
          : > "${links_file}"
          while IFS= read -r changed; do
            if [[ "${changed}" == "${PM_SYNC_TRACKER}/"*/*.toon ]]; then
              item_id="${changed##*/}"
              item_id="${item_id%.toon}"
              # The default-branch link is the permanent one after merge; the branch link
              # shows the proposed item while the review PR is open.
              printf -- '- [%s](https://github.com/%s/blob/%s/%s) ([proposed](https://github.com/%s/blob/%s/%s))\n' "${item_id}" "${REPOSITORY}" "${DEFAULT_BRANCH}" "${changed}" "${REPOSITORY}" "${SYNC_BRANCH}" "${changed}" >> "${links_file}"
            fi
          done < <(git diff --cached --name-only -- "${sync_scope[0]}" "${sync_scope[@]:2}")
          if [[ "${CLOSEOUT_REVIEW:-0}" != 0 ]]; then
            printf -- '- [Delivery attribution needing review](https://github.com/%s/blob/%s/%s/closeout-review.json)\n' "${REPOSITORY}" "${SYNC_BRANCH}" "${PM_SYNC_TRACKER}" >> "${links_file}"
          fi
          if [[ ! -s "${links_file}" ]]; then
            echo "::error::Closeout changed tracker state but no item link could be generated."
            exit 1
          fi
          # Publish only actionable decisions and counts, with no API prose.
          summary_file="${RUNNER_TEMP}/pm-github-closeout-summary.json"
          jq '{plan: [.plan[] | select(.code != "already_terminal" and .code != "other_repository" and .code != "duplicate_selection" and .code != "explicit_skip" and .code != "not_merged") | {item, pr, action: (if .action == "skip" and .code != "not_delivery" then "refuse" else .action end), code} + (if .candidates then {candidates} else {} end) + (if .missing_evidence then {missing_evidence} else {} end)], skipped: ([.plan[] | select(.code == "already_terminal" or .code == "other_repository" or .code == "duplicate_selection" or .code == "explicit_skip" or .code == "not_merged")] | group_by(.code) | map({key: .[0].code, value: length}) | from_entries)}' "${RUNNER_TEMP}/pm-github-closeout.json" > "${summary_file}"
          # Scan the public summary as added diff content before any publication.
          summary_patch="${RUNNER_TEMP}/pm-github-closeout-summary.patch"
          {
            printf '%s\n' '--- /dev/null' '+++ b/closeout-summary.json'
            printf '@@ -0,0 +1,%s @@\n' "$(wc -l < "${summary_file}")"
            sed 's/^/+/' "${summary_file}"
          } > "${summary_patch}"
          pm github gate --diff "${summary_patch}" --json
          # Re-enumerate all status paths, re-stage and re-scan immediately before
          # committing. --only prevents any unrelated staged path from leaking
          # even if the scope check is bypassed. NUL paths preserve odd filenames.
          gate_sync_change
          restore_sync_setup
          check_sync_scope
          git --literal-pathspecs commit --only --pathspec-from-file="${RUNNER_TEMP}/pm-github-sync-commit-paths" --pathspec-file-nul -m "chore(pm): close items delivered by merged pull requests"
          gh auth setup-git
          git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${SYNC_LEASE}" origin "HEAD:refs/heads/${SYNC_BRANCH}"
          body_file="${RUNNER_TEMP}/pm-github-sync-pr.md"
          {
            printf '%s\n\n' "Automated pm-github merged-PR closeout for ${REPOSITORY}."
            printf '%s\n\n' "The closeout command verified delivery and head checks for closed items; needs_review items remain open with every candidate listed below. The proposed tracker change and regenerated changelog passed the fail-closed privacy gate before anything was committed. \`${DEFAULT_BRANCH}\` is never pushed directly."
            if [[ "${CLOSEOUT_REVIEW:-0}" != 0 ]]; then
              printf '%s\n\n' "Automatic merge is disabled because delivery attribution needs_review; every candidate and evidence gap requires human review before landing. Any previous auto-merge request was explicitly disabled before this run."
            fi
            printf '%s\n\n' "Tracker items changed:"
            cat "${links_file}"
            printf '\n%s\n\n%s\n' 'Closeout plan (routine skips counted by reason):' '```json'
            cat "${summary_file}"
            printf '%s\n' '```'
          } > "${body_file}"
          pr_number="$(own_open_pr)"
          if [[ -z "${pr_number}" ]]; then
            gh pr create -R "${REPOSITORY}" --base "${DEFAULT_BRANCH}" --head "${SYNC_BRANCH}" --title "chore(pm): close items delivered by merged pull requests" --body-file "${body_file}"
          else
            gh pr edit "${pr_number}" -R "${REPOSITORY}" --title "chore(pm): close items delivered by merged pull requests" --body-file "${body_file}"
          fi
          pr_number="$(own_open_pr)"
          [[ "${pr_number}" =~ ^[0-9]+$ ]] || { echo "::error::Cannot resolve the owned automation PR number."; exit 1; }
          export SYNC_PR_NUMBER="${pr_number}"
          printf 'SYNC_PR_NUMBER=%s\n' "${pr_number}" >> "${GITHUB_ENV}"
          export SYNC_PUBLISHED=true
          printf 'SYNC_PUBLISHED=true\n' >> "${GITHUB_ENV}"

      - name: Dispatch caller CI and report parked runs
        # Only dispatch, arm and report; no caller CI can extend this bound.
        timeout-minutes: 5
        if: env.SYNC_PUBLISHED == 'true'
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
          APP_DEADLINE: ${{ steps.publication_auth.outputs.deadline }}
        shell: bash
        run: |
          set -Eeuo pipefail
          trap 'echo "::error::Caller check dispatch or auto-merge preparation failed; token requires actions:write, contents:write and pull-requests:write, and selected workflows must support workflow_dispatch. Inspect the bot PR state; no protection was bypassed."' ERR
          [[ "${SYNC_PUBLISHED:-false}" == true ]] || exit 0
          # Default inventory covers the fleet's CI and CodeQL names. An explicit
          # list replaces it; empty disables dispatch AND automatic landing.
          if [[ -z "${CI_WORKFLOWS}" ]]; then
            echo "::notice::Caller CI dispatch and automatic landing are disabled by ci-workflows."
            exit 0
          fi
          workflows=()
          while IFS= read -r workflow_file; do
            [[ -n "${workflow_file}" ]] || continue
            [[ "${workflow_file}" =~ ^[a-zA-Z0-9_.-]+\.ya?ml$ ]] || { echo "::error::ci-workflows must contain workflow filenames."; exit 1; }
            if [[ ! -f ".github/workflows/${workflow_file}" ]]; then
              echo "::notice::Skipping missing caller workflow: ${workflow_file}"
              continue
            fi
            # Standard block and compact trigger forms; nested job/input keys
            # cannot make a workflow dispatchable. Unknown forms fail closed.
            if ! awk '
              /^(on|"on"|\047on\047) *: *workflow_dispatch *(#.*)?$/ { found=1 }
              /^(on|"on"|\047on\047) *: *\[([^]]*, *)?workflow_dispatch *(,|\])/ { found=1 }
              /^(on|"on"|\047on\047) *: *($|#)/ { in_on=1; depth=-1; next }
              /^[^[:space:]#]/ && !/^- +/ { in_on=0 }
              in_on && /^[[:space:]]*[^[:space:]#]/ {
                match($0, /^[[:space:]]*/)
                if (depth < 0) depth=RLENGTH
                if (RLENGTH == depth) {
                  rest=substr($0, depth + 1); sub(/^- +/, "", rest)
                  if (rest ~ /^workflow_dispatch *(:|$|#)/) found=1
                }
              }
              END { exit !found }
            ' ".github/workflows/${workflow_file}"; then
              echo "::warning::Skipping non-dispatchable caller workflow: ${workflow_file}. Add workflow_dispatch: under on: on the default branch for manual head validation. Eligible native PR checks must still pass."
              continue
            fi
            mapfile -O "${#workflows[@]}" -t workflows < <(printf '%s\n' "${workflow_file}")
          done < <(printf '%s\n' "${CI_WORKFLOWS}" | tr ' \t\r' '\n')
          if [[ ${#workflows[@]} == 0 ]]; then
            echo "::error::No dispatchable caller workflow; automatic landing refused."
            exit 1
          fi
          # Dispatch every selected workflow before requesting protected auto-merge.
          dispatch_checks() {
            local workflow_file
            for workflow_file in "${workflows[@]}"; do
              gh workflow run "${workflow_file}" -R "${REPOSITORY}" --ref "${SYNC_BRANCH}"
            done
          }
          # --auto respects required checks and conversation resolution. The SHA
          # guard refuses a changed head; a disabled repository setting or missing
          # branch protection is a reported fallback, never a bypass. Every path
          # returns a status: 0 only after the arm call itself succeeded, so an
          # armed flag can record an observed result and never an intention.
          enable_auto_merge() {
            if [[ -z "${APP_DEADLINE:-}" ]]; then
              echo "::notice title=github_token_requires_approval::GITHUB_TOKEN native PR checks require maintainer approval; auto-merge waits for those required checks. Configure the optional automation App for unattended checks. A GITHUB_TOKEN merge does not start default-branch push workflows."
            fi
            # gh --auto can merge immediately when no rule blocks the PR. Check
            # repository settings, classic protection and applicable rules once, never poll checks.
            local auto_allowed base_ref branch_json rules_json strict_allowed merge_error merge_reason
            if ! auto_allowed="$(gh api "repos/${REPOSITORY}" --jq '.allow_auto_merge')" || [[ "${auto_allowed}" != true ]]; then
              echo "::notice::Squash auto-merge unavailable: repository auto-merge is disabled or its setting could not be verified; the next scheduled run retries."
              return 1
            fi
            base_ref="$(jq -nr --arg ref "${DEFAULT_BRANCH}" '$ref | @uri')"
            if ! branch_json="$(gh api "repos/${REPOSITORY}/branches/${base_ref}")" || ! jq -e '.protected == true' <<< "${branch_json}" >/dev/null; then
              echo "::notice::Squash auto-merge unavailable: base branch protection is absent or could not be verified; the next scheduled run retries."
              return 1
            fi
            # Protection alone can mean only reviews/conversations. Dispatched
            # checks cannot block a CLEAN PR unless at least one check is required.
            # Read both sources even when classic protection already names checks;
            # an unreadable rules API is an unverifiable prerequisite, not absence.
            if ! rules_json="$(gh api "repos/${REPOSITORY}/rules/branches/${base_ref}" --paginate --slurp)"; then
              echo "::notice title=required_checks_unverified::Squash auto-merge unavailable: required PR CI status checks could not be verified because the base branch rules API could not be read; the next scheduled run retries."
              return 1
            fi
            if ! jq -en --argjson branch "${branch_json}" --argjson rules "${rules_json}" '
              [ $branch.protection.required_status_checks | select(.enforcement_level != "off") | (.contexts[]?, .checks[]?.context) ]
              + [ $rules[][] | select(.type == "required_status_checks") | .parameters.required_status_checks[]?.context ]
              | any(.[]; type == "string" and length > 0)
            ' >/dev/null; then
              echo "::notice title=required_checks_unconfigured::Squash auto-merge unavailable: base branch must require at least one PR CI status check through classic protection or an applicable ruleset; no required check could be verified; the next scheduled run retries."
              return 1
            fi
            # Required names alone can be loose: GitHub must also enforce freshness.
            # Rulesets expose this directly; classic branch strictness is available
            # on the matching GraphQL rule, not the REST branch summary.
            if ! jq -e 'any(.[][]; .type == "merge_queue" or
              (.type == "required_status_checks" and .parameters.strict_required_status_checks_policy == true
                and any(.parameters.required_status_checks[]?.context; type == "string" and length > 0)))' <<< "${rules_json}" >/dev/null; then
              if ! strict_allowed="$(gh api graphql -F owner="${REPOSITORY%%/*}" -F repo="${REPOSITORY#*/}" -F ref="refs/heads/${DEFAULT_BRANCH}" \
                -f query='query($owner:String!,$repo:String!,$ref:String!){repository(owner:$owner,name:$repo){ref(qualifiedName:$ref){branchProtectionRule{requiresStatusChecks requiresStrictStatusChecks}}}}' \
                --jq '.data.repository.ref.branchProtectionRule | .requiresStatusChecks == true and .requiresStrictStatusChecks == true')"; then
                echo "::notice title=branch_freshness_unverified::Squash auto-merge unavailable: the up-to-date branch requirement could not be read; the next scheduled run retries."
                return 1
              fi
              if [[ "${strict_allowed}" != true ]] || ! jq -e '.protection.required_status_checks.enforcement_level != "off"' <<< "${branch_json}" >/dev/null; then
                echo "::notice title=required_checks_not_strict::Squash auto-merge unavailable: require branches to be up to date before merging or configure an applicable merge queue; the next scheduled run retries."
                return 1
              fi
            fi
            merge_error="$(mktemp)"
            if gh pr merge "${SYNC_PR_NUMBER}" -R "${REPOSITORY}" --auto --squash --match-head-commit "${head_sha}" 2> "${merge_error}"; then
              rm -f -- "${merge_error}"
              return 0
            fi
            merge_reason="$(head -n 1 -- "${merge_error}" 2>/dev/null | tr -d '\r' | tr -cd '[:print:]' | sed 's/%/%25/g' || true)"
            rm -f -- "${merge_error}"
            echo "::notice::Squash auto-merge unavailable for the bot PR${merge_reason:+ (${merge_reason})}. Repository settings or branch rules require attention; a maintainer can land the PR after checks, or the next scheduled run retries. No protection was bypassed."
            return 1
          }
          head_sha="$(git rev-parse HEAD)"
          printf 'DISPATCHED_CI_WORKFLOWS=%s\n' "${workflows[*]}" >> "${GITHUB_ENV}"
          printf 'CI_DISPATCH_STARTED_AT=%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "${GITHUB_ENV}"
          dispatch_checks
          if [[ "${CLOSEOUT_REVIEW:-0}" != 0 ]]; then
            echo "::notice::Delivery attribution needs review; caller checks were dispatched and automatic landing is disabled."
          fi
          # Capture the arm status before any later command: a reported fallback
          # must not fail the step, and only an observed success may record it.
          auto_merge_armed=false
          if [[ "${CLOSEOUT_REVIEW:-0}" == 0 ]]; then
            enable_auto_merge && auto_merge_armed=true || auto_merge_armed=false
          fi
          # The flag records an observed successful arm, never the intention: a
          # failed arm leaves any request armed earlier in this run revocable by
          # the always() cleanup instead of surviving it.
          if [[ "${auto_merge_armed}" == true ]]; then
            printf 'CLOSEOUT_AUTOMERGE_ALLOWED=true\n' >> "${GITHUB_ENV}"
          fi
          # Informational reporting must not fail dispatch or revoke armed auto-merge.
          if ! parked_runs="$(gh run list -R "${REPOSITORY}" --commit "${head_sha}" --status action_required --limit 100 --json url --jq '.[].url')"; then
            parked_runs=""
            echo "::notice::Could not list approval-required runs; inspect the bot PR for workflows awaiting maintainer approval. Dispatch and auto-merge preparation are unchanged."
          fi
          parked_json="$(jq -cn --arg urls "${parked_runs}" '$urls | split("\n") | map(select(length > 0))')"
          printf 'PARKED_CI_RUN_URLS=%s\n' "${parked_json}" >> "${GITHUB_ENV}"
          while IFS= read -r run_url; do
            [[ -n "${run_url}" ]] || continue
            echo "::notice::A pull-request workflow requires maintainer approval: ${run_url}. Dispatched head checks do not satisfy PR branch rules; the optional automation App starts eligible native PR runs."
          done <<< "${parked_runs}"
          # Never wait in-job for caller CI: it takes runners from the same account
          # pool, so polling here can only lengthen the queue it waits on. Required
          # checks decide the armed auto-merge; a base advance after publication or
          # an unavailable auto-merge waits for the next scheduled run, which
          # rebuilds this branch from the current default branch and retries.
          # No in-job wait remains because no contract needs one: the parked-run
          # report reads runs GitHub already registered for the published head.
          echo "::notice::Landing stays outside this runner: required checks decide the armed auto-merge, and the next scheduled run retries when auto-merge cannot be armed or the base advanced. Unresolved conversations still require resolution."

      - name: Confirm caller CI registration and summarize handoff
        id: ci_handoff
        if: env.SYNC_PUBLISHED == 'true'
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          pr_url="${GITHUB_SERVER_URL:-https://github.com}/${REPOSITORY}/pull/${SYNC_PR_NUMBER}"
          run_urls='[]'
          confirmation=disabled
          read -r -a pending <<< "${DISPATCHED_CI_WORKFLOWS:-}"
          head_sha="$(git rev-parse HEAD)"
          # One shared 60-second budget for all workflows, including API time.
          # Only discover registration: queued, running and completed all count.
          deadline=$((SECONDS + 60))
          for round in {1..12}; do
            [[ ${#pending[@]} != 0 ]] || break
            missing=()
            for workflow_file in "${pending[@]}"; do
              remaining=$((deadline - SECONDS))
              [[ ${remaining} -ge 10 ]] || break
              if urls="$(timeout --signal=KILL 10s gh run list -R "${REPOSITORY}" \
                --workflow "${workflow_file}" --branch "${SYNC_BRANCH}" --commit "${head_sha}" \
                --event workflow_dispatch --created ">=${CI_DISPATCH_STARTED_AT}" \
                --limit 100 --json url --jq '.[].url')" && [[ -n "${urls}" ]]; then
                run_urls="$(jq -cn --argjson previous "${run_urls}" --arg urls "${urls}" '$previous + ($urls | split("\n") | map(select(length > 0))) | unique')"
              else
                missing+=("${workflow_file}")
              fi
            done
            if [[ ${remaining:-0} -lt 10 ]]; then break; fi
            pending=("${missing[@]}")
            [[ ${#pending[@]} != 0 ]] || break
            remaining=$((deadline - SECONDS))
            [[ ${remaining} -gt 0 && ${round} -lt 12 ]] || break
            pause=$((remaining < 5 ? remaining : 5))
            sleep "${pause}"
          done
          if [[ -n "${DISPATCHED_CI_WORKFLOWS:-}" ]]; then
            confirmation=confirmed
            if [[ ${#pending[@]} != 0 ]]; then
              confirmation=timed_out
              echo "::notice::Caller CI registration not confirmed within 60 seconds; inspect ${pr_url}. Sync remains successful; the next scheduled run retries."
            fi
          fi
          parked_urls="${PARKED_CI_RUN_URLS:-[]}"
          {
            printf 'pr-url=%s\nci-run-urls=%s\nparked-run-urls=%s\nci-confirmation=%s\n' "${pr_url}" "${run_urls}" "${parked_urls}" "${confirmation}"
          } >> "${GITHUB_OUTPUT}"
          {
            printf '### Caller CI handoff\n\nPR: %s\n\nRegistration: `%s` (appearance only; no completion wait).\n\n' "${pr_url}" "${confirmation}"
            printf 'Registered caller CI runs:\n'
            jq -r '.[] | "- " + .' <<< "${run_urls}"
            printf '\nAlready parked as `action_required`:\n'
            jq -r '.[] | "- " + .' <<< "${parked_urls}"
            printf '\nRequired PR checks decide protected auto-merge. The hourly approval sweep or a maintainer handles parked native runs. The next scheduled run rebuilds and retries if landing is blocked.\n'
          } >> "${GITHUB_STEP_SUMMARY}"

      # Also revoke on dispatch/maintenance failure, cancellation, disabled CI,
      # no publication, or a hold. This runs even when an earlier step failed.
      - name: Disarm closeout auto-merge on unsuccessful landing
        if: ${{ always() && (failure() || cancelled() || env.CLOSEOUT_AUTOMERGE_ALLOWED != 'true') }}
        env:
          GH_TOKEN: ${{ steps.automation_token.outputs.token || github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Use the caller identity and fixed branch, even when input validation fails.
          # Filter same-repository heads; a fork using the same branch is never ours.
          numbers="$(gh pr list -R "${CALLING_REPOSITORY}" --head pm-github/closeout --state open \
            --json number,headRepository,headRepositoryOwner,isCrossRepository,autoMergeRequest \
            | jq -r --arg repository "${CALLING_REPOSITORY}" \
              '.[] | select(.isCrossRepository == false and (.headRepositoryOwner.login + "/" + .headRepository.name) == $repository and .autoMergeRequest != null) | .number')"
          while IFS= read -r number; do
            [[ -n "${number}" ]] || continue
            gh pr merge "${number}" -R "${CALLING_REPOSITORY}" --disable-auto
          done <<< "${numbers}"
