# Replace release placeholders after the gated extension is published.
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
jobs:
  gated-sync:
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@RELEASE_COMMIT_SHA
    with:
      repository: unbraind/pm-graph
      pm-github-version: "RELEASE_VERSION"
