# Pin a reviewed release SHA and its matching tag comment; Dependabot maintains both.
# The workflow resolves its exact package version from the release tag on that SHA.
# See README.md for the daily github-actions pm-toolchain group configuration.
# Unattended landing needs the optional App client ID/key mapping below.
# Each configured CI workflow must enable workflow_dispatch and produce its required
# check names on that event. Missing files are skipped with a notice.
# Parked action_required PR runs are reported with URLs; dispatch runs separately.
# Callers need no guard of their own: the reusable workflow's first step requires
# the caller's default branch for both schedule and workflow_dispatch. Selecting
# another branch for manual dispatch fails with an error naming both refs.
# It resolves the default branch through the repository API with the job token,
# falling back to payload metadata when present; schedule needs no repository object.
# Unresolved branches fail closed before checkout. Checkout, sync preparation,
# PR bases and tracker links use that branch, including trunk or release/stable.
# Repository setup: Settings -> Actions -> General -> Workflow permissions must allow
# read and write permissions and enable "Allow GitHub Actions to create and approve
# pull requests" (off by default for new personal repositories; an organization can
# disable it). Without it the sync branch is pushed but the review PR is not opened.
name: Sync GitHub issues into pm
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  issues: read
  actions: write # Required to dispatch the caller CI after opening/updating the PR.
jobs:
  gated-sync:
    uses: unbraind/pm-github/.github/workflows/pm-github-sync.yml@RELEASE_COMMIT_SHA # vRELEASE_VERSION
    with:
      automation-app-client-id: ${{ vars.PM_GITHUB_APP_CLIENT_ID }}
      npm-project-dir: "." # For pm-rust, use: npm-project-dir: tests/oracle
      # Defaults shown explicitly; use "" to disable an optional action; empty CI also disables auto-merge.
      post-import-script: "changelog:full"
      ci-workflows: "ci.yml codeql.yml" # Whitespace-separated filenames, e.g. "ci.yml codeql.yml".
    secrets:
      automation_app_private_key: ${{ secrets.PM_GITHUB_APP_PRIVATE_KEY }}
